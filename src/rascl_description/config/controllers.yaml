controller_manager:
  ros__parameters:
    update_rate: 10

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rascl_position_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters: {}

rascl_position_controller:
  ros__parameters:
    joints:
      - shoulder_joint
      - upperarm_joint
      - lowerarm_joint
      - spur_gear_joint
    interface_name: position
